name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: ai_test
          POSTGRES_DB: ai_compliance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test -d ai_compliance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OPENAI_API_KEY: dummy_test_key
      DEFAULT_MODEL: gpt-4.1-nano
      APP_ENV: testing
      FEATURE_ID_ENFORCEMENT: warn
      CANDIDATE_VERSION_POLICY: allow_with_warning
      EVIDENCE_CHAIN_MODE: best_effort_tenant_chain
      EVIDENCE_HMAC_SECRET: test_secret_123456789
      DATABASE_URL: postgresql+psycopg2://ai_test:ai_test@localhost:5432/ai_compliance_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest

      - name: Check downgrade/upgrade
        run: |
          alembic downgrade -1
          alembic upgrade head
