services:
  postgres-test:
    image: postgres:16
    container_name: ai_compliance_postgres_test
    environment:
      POSTGRES_USER: ai_test
      POSTGRES_PASSWORD: ai_test
      POSTGRES_DB: ai_compliance_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_test -d ai_compliance_test"]
      interval: 5s
      timeout: 5s
      retries: 10
