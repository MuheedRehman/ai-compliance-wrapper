substitutions:
  _REGION: europe-west3
  _ARTIFACT_REPOSITORY: backend-repo
  _BACKEND_SERVICE: ai-compliance-backend
  _FRONTEND_SERVICE: ai-compliance-dashboard
  _MIGRATION_JOB: ai-compliance-migrate
  _SEED_JOB: ai-compliance-seed
  _CLOUD_SQL_INSTANCE: ''
  _CLOUD_RUN_SERVICE_ACCOUNT: ''

steps:
  - name: ubuntu
    id: validate-inputs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "$_CLOUD_SQL_INSTANCE" || (echo "ERROR: _CLOUD_SQL_INSTANCE is required." && exit 1)
        test -n "$_CLOUD_RUN_SERVICE_ACCOUNT" || (echo "ERROR: _CLOUD_RUN_SERVICE_ACCOUNT is required." && exit 1)

  - name: python:3.11-slim
    id: run-backend-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio psycopg2-binary
        pytest tests/

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - .
    waitFor:
      - run-backend-tests

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
    waitFor:
      - build-backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --service-account
      - ${_CLOUD_RUN_SERVICE_ACCOUNT}
      - --set-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest
      - --command
      - alembic
      - --args
      - upgrade,head
      - --max-retries
      - '0'
      - --execute-now
      - --wait
    waitFor:
      - push-backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: seed-staging-data
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SEED_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --service-account
      - ${_CLOUD_RUN_SERVICE_ACCOUNT}
      - --set-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest,DASHBOARD_API_KEY=DASHBOARD_API_KEY:latest
      - --command
      - python
      - --args
      - scripts/seed_dashboard_key.py
      - --max-retries
      - '0'
      - --execute-now
      - --wait
    waitFor:
      - run-migrations

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_CLOUD_RUN_SERVICE_ACCOUNT}
      - --add-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging,FRONTEND_URL=*
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest
      - --max-instances
      - '2'
    waitFor:
      - seed-staging-data

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: capture-backend-url
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --format='value(status.url)' > /workspace/backend_url.txt
    waitFor:
      - deploy-backend

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BACKEND_URL="$(cat /workspace/backend_url.txt)"
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$$BACKEND_URL" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID" \
          apps/dashboard
    waitFor:
      - capture-backend-url

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID
    waitFor:
      - build-frontend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BACKEND_URL="$(cat /workspace/backend_url.txt)"
        gcloud run deploy "$_FRONTEND_SERVICE" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID" \
          --region "$_REGION" \
          --platform managed \
          --port 3000 \
          --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_API_URL=$$BACKEND_URL" \
          --max-instances 2
        gcloud run services describe "$_FRONTEND_SERVICE" \
          --region "$_REGION" \
          --format='value(status.url)' > /workspace/frontend_url.txt
    waitFor:
      - push-frontend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: lock-backend-cors-to-frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        FRONTEND_URL="$(cat /workspace/frontend_url.txt)"
        gcloud run services update "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --update-env-vars "FRONTEND_URL=$$FRONTEND_URL"
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
        echo "Dashboard URL: $$FRONTEND_URL"
    waitFor:
      - deploy-frontend

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
