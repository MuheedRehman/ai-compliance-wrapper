substitutions:
  _REGION: europe-west3
  _ARTIFACT_REPOSITORY: backend-repo
  _BACKEND_SERVICE: ai-compliance-backend
  _FRONTEND_SERVICE: ai-compliance-dashboard
  _MIGRATION_JOB: ai-compliance-migrate
  _SEED_JOB: ai-compliance-seed
  _CLOUD_SQL_INSTANCE: ''
  _BACKEND_SERVICE_ACCOUNT: ''
  _DASHBOARD_SERVICE_ACCOUNT: ''
  _AUTH_PASSWORD_ENABLED: 'true'
  _DASHBOARD_BASE_URL: ''
  _GOOGLE_OIDC_ALLOWED_DOMAINS: ''
  _GOOGLE_OIDC_ALLOWED_EMAILS: ''
  _DASHBOARD_OWNER_EMAIL: ''
  _DASHBOARD_OWNER_NAME: 'Dashboard Owner'

steps:
  - name: ubuntu
    id: validate-inputs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "$_CLOUD_SQL_INSTANCE" || (echo "ERROR: _CLOUD_SQL_INSTANCE is required." && exit 1)
        test -n "$_BACKEND_SERVICE_ACCOUNT" || (echo "ERROR: _BACKEND_SERVICE_ACCOUNT is required." && exit 1)
        test -n "$_DASHBOARD_SERVICE_ACCOUNT" || (echo "ERROR: _DASHBOARD_SERVICE_ACCOUNT is required." && exit 1)

  - name: python:3.11-slim
    id: run-backend-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio psycopg2-binary
        pytest tests/

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - .
    waitFor:
      - run-backend-tests

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
    waitFor:
      - build-backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --service-account
      - ${_BACKEND_SERVICE_ACCOUNT}
      - --set-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest
      - --command
      - alembic
      - --args
      - upgrade,head
      - --max-retries
      - '1'
      - --execute-now
      - --wait
    waitFor:
      - push-backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: seed-staging-data
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SEED_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --service-account
      - ${_BACKEND_SERVICE_ACCOUNT}
      - --set-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging,GOOGLE_OIDC_ALLOWED_DOMAINS=${_GOOGLE_OIDC_ALLOWED_DOMAINS},GOOGLE_OIDC_ALLOWED_EMAILS=${_GOOGLE_OIDC_ALLOWED_EMAILS},DASHBOARD_OWNER_EMAIL=${_DASHBOARD_OWNER_EMAIL},DASHBOARD_OWNER_NAME=${_DASHBOARD_OWNER_NAME}
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest,DASHBOARD_API_KEY=DASHBOARD_API_KEY:latest
      - --command
      - python
      - --args
      - scripts/seed_dashboard_key.py
      - --max-retries
      - '0'
      - --execute-now
      - --wait
    waitFor:
      - run-migrations

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_BACKEND_SERVICE_ACCOUNT}
      - --add-cloudsql-instances
      - ${_CLOUD_SQL_INSTANCE}
      - --set-env-vars
      - APP_ENV=staging,FRONTEND_URL=*,AI_PROVIDER_MODE=demo
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,EVIDENCE_HMAC_SECRET=EVIDENCE_HMAC_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest
      - --memory
      - 1Gi
      - --max-instances
      - '2'
    waitFor:
      - seed-staging-data

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: capture-backend-url
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --format='value(status.url)' > /workspace/backend_url.txt
    waitFor:
      - deploy-backend

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID" \
          apps/dashboard
    waitFor:
      - capture-backend-url

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID
    waitFor:
      - build-frontend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BACKEND_URL="$(cat /workspace/backend_url.txt)"
        DASHBOARD_BASE_URL="${_DASHBOARD_BASE_URL}"
        if [ -z "$$DASHBOARD_BASE_URL" ]; then
          DASHBOARD_BASE_URL="$(gcloud run services describe "$_FRONTEND_SERVICE" --region "$_REGION" --format='value(status.url)' 2>/dev/null || true)"
        fi
        test -n "$$DASHBOARD_BASE_URL" || (echo "ERROR: _DASHBOARD_BASE_URL is required for first-time dashboard deployment." && exit 1)
        FRONTEND_SECRETS="DASHBOARD_API_KEY=DASHBOARD_API_KEY:latest,DASHBOARD_ADMIN_PASSWORD=DASHBOARD_ADMIN_PASSWORD:latest,DASHBOARD_SESSION_SECRET=DASHBOARD_SESSION_SECRET:latest"
        if gcloud secrets versions describe latest --secret GOOGLE_OIDC_CLIENT_ID >/dev/null 2>&1 && \
          gcloud secrets versions describe latest --secret GOOGLE_OIDC_CLIENT_SECRET >/dev/null 2>&1; then
          FRONTEND_SECRETS="$$FRONTEND_SECRETS,GOOGLE_OIDC_CLIENT_ID=GOOGLE_OIDC_CLIENT_ID:latest,GOOGLE_OIDC_CLIENT_SECRET=GOOGLE_OIDC_CLIENT_SECRET:latest"
        else
          echo "Google OIDC secrets are not populated; Google login will remain disabled."
        fi
        gcloud run deploy "$_FRONTEND_SERVICE" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID" \
          --region "$_REGION" \
          --platform managed \
          --service-account "${_DASHBOARD_SERVICE_ACCOUNT}" \
          --port 3000 \
          --set-env-vars "NODE_ENV=production,BACKEND_URL=$$BACKEND_URL,BACKEND_AUTH_MODE=google_id_token,AUTH_PASSWORD_ENABLED=${_AUTH_PASSWORD_ENABLED},GOOGLE_OIDC_REDIRECT_URI=$$DASHBOARD_BASE_URL/api/auth/google/callback,GOOGLE_OIDC_ALLOWED_DOMAINS=${_GOOGLE_OIDC_ALLOWED_DOMAINS},GOOGLE_OIDC_ALLOWED_EMAILS=${_GOOGLE_OIDC_ALLOWED_EMAILS}" \
          --set-secrets "$$FRONTEND_SECRETS" \
          --max-instances 2
        gcloud run services describe "$_FRONTEND_SERVICE" \
          --region "$_REGION" \
          --format='value(status.url)' > /workspace/frontend_url.txt
    waitFor:
      - push-frontend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: secure-backend-access
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        FRONTEND_URL="$(cat /workspace/frontend_url.txt)"
        gcloud run services add-iam-policy-binding "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --member "serviceAccount:${_DASHBOARD_SERVICE_ACCOUNT}" \
          --role roles/run.invoker
        if gcloud run services get-iam-policy "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --format=json | grep -q '"allUsers"'; then
          gcloud run services remove-iam-policy-binding "$_BACKEND_SERVICE" \
            --region "$_REGION" \
            --member allUsers \
            --role roles/run.invoker
        else
          echo "Backend allUsers invoker binding already absent."
        fi
        gcloud run services update "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --update-env-vars "FRONTEND_URL=$$FRONTEND_URL"
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
        echo "Dashboard URL: $$FRONTEND_URL"
    waitFor:
      - deploy-frontend

  - name: mcr.microsoft.com/playwright:v1.60.0-noble
    id: run-dashboard-e2e
    dir: apps/dashboard
    entrypoint: bash
    secretEnv:
      - DASHBOARD_ADMIN_PASSWORD
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        DASHBOARD_URL="$(cat /workspace/frontend_url.txt)" \
        DASHBOARD_PASSWORD="$$DASHBOARD_ADMIN_PASSWORD" \
        npm run e2e:staging
    waitFor:
      - secure-backend-access

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/ai-compliance-dashboard:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DASHBOARD_ADMIN_PASSWORD/versions/latest
      env: DASHBOARD_ADMIN_PASSWORD
